<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <title>猫砂账本</title>
  <style>
    :root{--ink:#302a27;--muted:#8b817b;--peach:#e8785e;--peach-light:#f8d7cb;--soft:#fff3ed;--panel:#fff;--line:#efe8e2;--green:#5d9671;--green-bg:#eff8f1;--amber:#bf7a2c;--amber-bg:#fff6e8;--shadow:0 12px 32px rgba(75,48,37,.08)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8f2,#f5f2ef);font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}main{max-width:720px;min-height:100dvh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 14px calc(94px + env(safe-area-inset-bottom))}.topbar,.bar,.row,.sheet-actions{display:flex;align-items:center;justify-content:space-between}.kicker{margin:0;color:var(--peach);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:3px 0 0;font-size:29px;letter-spacing:-.03em}h2{margin:0;font-size:19px}.icon-btn,.nav{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:13px;background:var(--soft);color:var(--peach);font-size:26px}.card{margin-top:16px;border:1px solid var(--line);border-radius:21px;background:var(--panel);box-shadow:var(--shadow)}.hero{display:flex;justify-content:space-between;align-items:center;padding:22px;background:linear-gradient(135deg,#f9dbd0,#f5bca9);border:0}.hero span,.hero small{display:block}.hero strong{display:block;margin:4px 0;font-size:31px;letter-spacing:-.04em}.hero small{color:#73564b;font-size:12px}.cat{font-size:39px}.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:13px 8px}.stat{padding:3px 9px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span,.stat strong{display:block}.stat span{color:var(--muted);font-size:11px}.stat strong{margin-top:4px;font-size:15px}.calendar{padding:15px 9px 12px}.bar{padding:0 3px 13px;font-size:14px;font-weight:800}.bar .nav{width:37px;height:37px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{color:var(--muted);font-size:11px;text-align:center}.grid{gap:3px 1px;margin-top:5px}.blank{aspect-ratio:1}.day{min-width:0;aspect-ratio:1;border:0;border-radius:11px;background:none;color:var(--ink);font-weight:800;font-size:13px}.day.has{background:var(--soft)}.day.today i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--peach);color:#fff;font-style:normal}.day i{font-style:normal}.day em{display:block;margin-top:2px;color:var(--peach);font-size:9px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day.pending em{color:var(--amber)}.hint{text-align:center;color:var(--muted);font-size:11px;margin:12px 0 0}.tools{padding:17px}.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.tool{min-height:59px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:12px;font-weight:700}.tool b{display:block;color:var(--peach);font-size:18px}.records{padding:18px}.text-btn{border:0;background:none;color:var(--peach);font-size:12px;font-weight:800}.entry{display:flex;align-items:center;width:100%;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}.entry:last-child{border:0}.datebox{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--peach);font-size:13px;font-weight:800;font-style:normal}.meta{flex:1;min-width:0}.meta b,.meta span{display:block}.meta span{margin-top:3px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{color:var(--peach);font-weight:800}.badge{flex:none;padding:4px 6px;border-radius:7px;background:var(--green-bg);color:var(--green);font-size:10px;font-style:normal}.badge.pending{background:var(--amber-bg);color:var(--amber)}.empty{padding:25px 0 8px;color:var(--muted);text-align:center;font-size:13px}.add{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:59px;height:59px;border:0;border-radius:19px;background:var(--ink);color:#fff;font-size:33px;box-shadow:0 12px 26px rgba(48,42,39,.28)}.shade{position:fixed;inset:0;z-index:5;display:grid;align-items:end;background:rgba(48,42,39,.32);backdrop-filter:blur(4px)}.shade[hidden]{display:none}.sheet{width:100%;max-height:94dvh;overflow:auto;padding:24px 20px calc(22px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#fff}.sheet h2{margin:6px 0 8px}.status{margin:0 0 15px;color:var(--muted);font-size:12px}.form-label{display:block;margin:14px 0 7px;font-size:13px;font-weight:800}.amount-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding-left:13px}.amount-wrap:focus-within{border-color:var(--peach);box-shadow:0 0 0 3px #e8785e20}.amount-wrap span{color:var(--peach);font-size:20px;font-weight:800}.amount-wrap input{border:0!important;box-shadow:none!important}.quick{display:flex;gap:7px;margin-top:8px}.quick button{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:9px 3px;color:var(--peach);font-size:13px;font-weight:800}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}input:focus,select:focus{border-color:var(--peach);box-shadow:0 0 0 3px #e8785e20}.sheet-actions{gap:10px;margin-top:23px}.sheet-actions button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800}.save{background:var(--ink);color:#fff}.secondary{background:#f3efeb;color:var(--muted)}.settings{display:grid;gap:10px}.settings .row{gap:10px}.settings .row label{flex:1;margin:0;font-size:13px;font-weight:800}.settings .row input{width:100px;text-align:center}.backup-note{margin:13px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:calc(93px + env(safe-area-inset-bottom));z-index:9;transform:translate(-50%,15px);padding:10px 15px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:601px){.shade{place-items:center}.sheet{width:430px;border-radius:23px;padding:28px}.add{right:max(28px,calc((100vw - 720px)/2))}.tools-grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<main>
  <header class="topbar"><div><p class="kicker">猫咪事务所</p><h1 id="title"></h1></div><button class="icon-btn" id="settingsBtn" aria-label="设置">⚙</button></header>
  <section class="card hero"><div><span>本月已付报酬</span><strong id="sum">¥0.00</strong><small id="count">本月已记录 0 天</small></div><div class="cat">🐾</div></section>
  <section class="card stats"><div class="stat"><span>待付</span><strong id="pendingTotal">¥0.00</strong></div><div class="stat"><span>日均报酬</span><strong id="average">¥0.00</strong></div><div class="stat"><span>最高单日</span><strong id="highest">¥0.00</strong></div></section>
  <section class="card calendar"><div class="bar"><button class="nav" id="prev">‹</button><span>每日铲屎报酬</span><button class="nav" id="next">›</button></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="grid" id="grid"></div><p class="hint">点击日期，记录今天的铲屎报酬</p></section>
  <section class="card tools"><div class="bar"><div><p class="kicker">本地数据</p><h2>备份与恢复</h2></div></div><div class="tools-grid"><button class="tool" id="exportBtn"><b>↓</b>导出备份</button><button class="tool" id="importBtn"><b>↑</b>导入恢复</button><button class="tool" id="installBtn"><b>＋</b>安装到桌面</button><button class="tool" id="defaultBtn"><b>¥</b>默认金额</button></div><input id="importFile" type="file" accept="application/json" hidden><p class="backup-note">所有账目仅保存于本机浏览器。建议每月导出一次备份，换手机时再导入恢复。</p></section>
  <section class="card records"><div class="bar"><div><p class="kicker">账本</p><h2>最近记录</h2></div><button id="clear" class="text-btn">清空本月</button></div><div id="list"></div></section>
</main>
<button class="add" id="add" aria-label="记录今天报酬">＋</button>
<div class="shade" id="recordShade" hidden><form class="sheet" id="recordForm"><p class="kicker">铲屎官打卡</p><h2 id="dateTitle"></h2><p class="status" id="saveStatus">草稿每 1 分钟自动保存到本机</p><label class="form-label">今天给弟弟多少报酬？</label><div class="amount-wrap"><span>¥</span><input id="money" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="例如 10"></div><div class="quick"><button type="button" data-money="5">¥5</button><button type="button" data-money="10">¥10</button><button type="button" data-money="20">¥20</button><button type="button" id="lastMoney">上次金额</button></div><label class="form-label">付款状态</label><select id="paid"><option value="paid">已付款</option><option value="pending">待付款</option></select><label class="form-label">备注（可选）</label><input id="note" maxlength="30" placeholder="例如：认真清理猫砂盆"><div class="sheet-actions"><button type="button" class="secondary" id="remove">删除</button><button class="save">保存报酬</button></div></form></div>
<div class="shade" id="settingsShade" hidden><section class="sheet"><p class="kicker">个人设置</p><h2>记账偏好</h2><div class="settings"><div class="row"><label for="defaultMoney">默认报酬金额</label><input id="defaultMoney" type="number" min="0" step="0.01"></div><div class="row"><label for="quickOne">快捷金额 1</label><input id="quickOne" type="number" min="0" step="0.01"></div><div class="row"><label for="quickTwo">快捷金额 2</label><input id="quickTwo" type="number" min="0" step="0.01"></div><div class="row"><label for="quickThree">快捷金额 3</label><input id="quickThree" type="number" min="0" step="0.01"></div></div><div class="sheet-actions"><button class="secondary" id="closeSettings">取消</button><button class="save" id="saveSettings">保存设置</button></div></section></div>
<div class="toast" id="toast"></div>
<script>
  const KEY='cat-day-records-v2', DRAFT='cat-day-draft-v2', PREF='cat-day-preferences-v2';
  let records=JSON.parse(localStorage.getItem(KEY)||'{}');
  let prefs=JSON.parse(localStorage.getItem(PREF)||'{"defaultMoney":10,"quick":[5,10,20]}');
  let month=new Date(), selected=''; month=new Date(month.getFullYear(),month.getMonth(),1);
  let installEvent=null; const $=id=>document.getElementById(id);
  const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(Number(n)||0);
  const save=()=>localStorage.setItem(KEY,JSON.stringify(records)); const savePrefs=()=>localStorage.setItem(PREF,JSON.stringify(prefs));
  function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
  function monthEntries(){const p=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-`;return Object.entries(records).filter(([k])=>k.startsWith(p)).sort((a,b)=>b[0].localeCompare(a[0]))}
  function render(){let y=month.getFullYear(),mo=month.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),today=dateKey(new Date()),grid=$('grid');$('title').textContent=`${y}年${String(mo+1).padStart(2,'0')}月`;grid.innerHTML='<span class="blank"></span>'.repeat(first);for(let d=1;d<=days;d++){const dt=new Date(y,mo,d),k=dateKey(dt),v=records[k];grid.innerHTML+=`<button class="day ${v?'has':''} ${v?.status==='pending'?'pending':''} ${k===today?'today':''}" data-date="${k}"><i>${d}</i>${v?`<em>${v.status==='pending'?'待 ':''}¥${Number(v.amount).toFixed(0)}</em>`:''}</button>`}const entries=monthEntries(),paid=entries.filter(([,v])=>v.status!=='pending'),pending=entries.filter(([,v])=>v.status==='pending'),paidSum=paid.reduce((s,[,v])=>s+Number(v.amount),0),pendingSum=pending.reduce((s,[,v])=>s+Number(v.amount),0),max=entries.length?Math.max(...entries.map(([,v])=>Number(v.amount))):0;$('sum').textContent=money(paidSum);$('count').textContent=`本月已记录 ${entries.length} 天`; $('pendingTotal').textContent=money(pendingSum);$('average').textContent=money(entries.length?(paidSum+pendingSum)/entries.length:0);$('highest').textContent=money(max);$('list').innerHTML=entries.length?entries.map(([k,v])=>`<button class="entry" data-date="${k}"><i class="datebox">${Number(k.slice(-2))}日</i><span class="meta"><b>${k}</b><span>${v.note||'铲屎报酬'}</span></span><i class="badge ${v.status==='pending'?'pending':''}">${v.status==='pending'?'待付款':'已付款'}</i><b class="amount">${money(v.amount)}</b></button>`).join(''):'<p class="empty">这个月还没有记录<br>点右下角“＋”开始记账吧</p>'}
  function lastAmount(){const vals=Object.entries(records).sort((a,b)=>b[0].localeCompare(a[0]));return vals[0]?.[1]?.amount||prefs.defaultMoney}
  function openRecord(k){selected=k;const draft=JSON.parse(localStorage.getItem(DRAFT)||'null'),v=draft?.date===k?draft:records[k];$('dateTitle').textContent=k;$('money').value=v?.amount??prefs.defaultMoney;$('note').value=v?.note||'';$('paid').value=v?.status||'paid';$('remove').style.visibility=records[k]?'visible':'hidden';$('saveStatus').textContent=draft?.date===k?'已恢复未提交草稿':'草稿每 1 分钟自动保存到本机';document.querySelectorAll('[data-money]').forEach((b,i)=>b.textContent=`¥${prefs.quick[i]}`);$('recordShade').hidden=false;setTimeout(()=>$('money').focus(),80)}
  function closeRecord(){ $('recordShade').hidden=true;selected='';render() }
  function saveDraft(){if(!selected||$('recordShade').hidden)return;localStorage.setItem(DRAFT,JSON.stringify({date:selected,amount:$('money').value,note:$('note').value,status:$('paid').value}));$('saveStatus').textContent='草稿已自动保存到本机'}
  $('grid').onclick=e=>{const b=e.target.closest('[data-date]');if(b)openRecord(b.dataset.date)};$('list').onclick=e=>{const b=e.target.closest('[data-date]');if(b)openRecord(b.dataset.date)};$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);render()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);render()};$('add').onclick=()=>openRecord(dateKey(new Date()));$('recordShade').onclick=e=>{if(e.target===$('recordShade'))closeRecord()};
  document.querySelector('.quick').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='lastMoney')$('money').value=lastAmount();else $('money').value=b.dataset.money;$('saveStatus').textContent='草稿将在 1 分钟内自动保存'};
  $('recordForm').onsubmit=e=>{e.preventDefault();const amount=Number($('money').value);if(!Number.isFinite(amount)||amount<0)return;records[selected]={amount,note:$('note').value.trim(),status:$('paid').value};save();localStorage.removeItem(DRAFT);toast('已保存到本机');closeRecord()};$('remove').onclick=()=>{if(records[selected]&&confirm('确定删除这天的记录吗？')){delete records[selected];save();localStorage.removeItem(DRAFT);closeRecord();toast('已删除记录')}};$('clear').onclick=()=>{if(confirm('确定清空本月全部记录吗？')){monthEntries().forEach(([k])=>delete records[k]);save();render();toast('已清空本月记录')}};
  $('settingsBtn').onclick=()=>{$('defaultMoney').value=prefs.defaultMoney;$('quickOne').value=prefs.quick[0];$('quickTwo').value=prefs.quick[1];$('quickThree').value=prefs.quick[2];$('settingsShade').hidden=false};$('closeSettings').onclick=()=>$('settingsShade').hidden=true;$('settingsShade').onclick=e=>{if(e.target===$('settingsShade'))$('settingsShade').hidden=true};$('saveSettings').onclick=()=>{prefs={defaultMoney:Number($('defaultMoney').value)||0,quick:[Number($('quickOne').value)||0,Number($('quickTwo').value)||0,Number($('quickThree').value)||0]};savePrefs();$('settingsShade').hidden=true;toast('偏好已保存')};$('defaultBtn').onclick=()=>$('settingsBtn').click();
  $('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'猫砂账本',version:2,exportedAt:new Date().toISOString(),records,prefs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`猫砂账本备份-${dateKey(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份文件已导出')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.records||typeof data.records!=='object')throw Error();if(!confirm('导入将覆盖当前本机账本，确定继续吗？'))return;records=data.records;prefs=data.prefs||prefs;save();savePrefs();render();toast('备份已恢复')}catch{alert('无法识别该备份文件')}finally{e.target.value=''}};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('installBtn').style.display='block'});$('installBtn').onclick=async()=>{if(!installEvent){toast('请在浏览器菜单中选择“添加到主屏幕”');return}installEvent.prompt();await installEvent.userChoice;installEvent=null};setInterval(()=>{save();saveDraft()},60000);addEventListener('pagehide',()=>{save();saveDraft()});
  if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script>
</body></html>
