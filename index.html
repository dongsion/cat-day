</style></head><body><main><header class="topbar"><div><p class="kicker">猫咪事务所</p><h1 id="title"></h1></div><button class="icon-btn" id="settingsBtn">⚙</button></header><section class="card hero"><div><span>本期已付报酬</span><strong id="sum">¥0.00</strong><small id="cycleLabel">本期结算</small></div><div class="cat">🐾</div></section><section class="card stats"><div class="stat"><span>本期待付</span><strong id="pendingTotal">¥0.00</strong></div><div class="stat"><span>本期日均</span><strong id="average">¥0.00</strong></div><div class="stat"><span>本期最高</span><strong id="highest">¥0.00</strong></div></section><section class="card calendar"><div class="bar"><button class="nav" id="prev">‹</button><span>每日铲屎报酬</span><button class="nav" id="next">›</button></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="grid" id="grid"></div><p class="hint">绿点=已付款　橙点=待付款　“+”=额外报酬</p></section><section class="card tools"><div class="bar"><div><p class="kicker">本地数据</p><h2>备份与恢复</h2></div></div><div class="tools-grid"><button class="tool" id="exportBtn"><b>↓</b>导出备份</button><button class="tool" id="importBtn"><b>↑</b>导入恢复</button><button class="tool" id="installBtn"><b>＋</b>安装到桌面</button><button class="tool" id="defaultBtn"><b>¥</b>默认金额</button></div><input id="importFile" type="file" accept="application/json" hidden><p class="backup-note">所有账目仅保存于本机浏览器。建议每月导出一次备份，换手机时再导入恢复。</p></section><section class="card records"><div class="bar"><div><p class="kicker">账本</p><h2>最近记录</h2></div><button id="clear" class="text-btn">清空本月</button></div><div id="list"></div></section></main><button class="add" id="add">＋</button><div class="shade" id="recordShade" hidden><form class="sheet" id="recordForm"><p class="kicker">铲屎官打卡</p><h2 id="dateTitle"></h2><p class="status" id="saveStatus">草稿每 1 分钟自动保存到本机</p><label class="form-label">记录类型</label><select id="recordType"><option value="daily">日常铲屎报酬</option><option value="extra">额外报酬</option></select><label class="form-label">报酬金额</label><div class="amount-wrap"><span>¥</span><input id="money" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="例如 10"></div><div class="quick"><button type="button" data-money="5">¥5</button><button type="button" data-money="10">¥10</button><button type="button" data-money="20">¥20</button><button type="button" id="lastMoney">上次金额</button></div><label class="form-label">付款状态</label><select id="paid"><option value="paid">已付款</option><option value="pending">待付款</option></select><label class="form-label">备注（可选）</label><input id="note" maxlength="30" placeholder="例如：月底额外奖励"><div class="sheet-actions"><button type="button" class="secondary" id="remove">删除</button><button class="save">保存报酬</button></div></form></div><div class="shade" id="settingsShade" hidden><section class="sheet"><p class="kicker">个人设置</p><h2>记账偏好</h2><div class="settings"><div class="row"><label for="settlementDay">每月结算日</label><input id="settlementDay" type="number" min="1" max="28"></div><div class="row"><label for="defaultMoney">默认报酬金额</label><input id="defaultMoney" type="number" min="0" step="0.01"></div><div class="row"><label for="quickOne">快捷金额 1</label><input id="quickOne" type="number" min="0" step="0.01"></div><div class="row"><label for="quickTwo">快捷金额 2</label><input id="quickTwo" type="number" min="0" step="0.01"></div><div class="row"><label for="quickThree">快捷金额 3</label><input id="quickThree" type="number" min="0" step="0.01"></div></div><p class="backup-note">结算周期从结算日当天开始，到下月结算日前一天结束。例如设为 15 日，则为每月 15 日至下月 14 日。</p><div class="sheet-actions"><button class="secondary" id="closeSettings">取消</button><button class="save" id="saveSettings">保存设置</button></div></section></div><div class="toast" id="toast"></div><script>
const KEY='cat-day-records-v3',OLD='cat-day-records-v2',DRAFT='cat-day-draft-v3',PREF='cat-day-preferences-v2';let records=JSON.parse(localStorage.getItem(KEY)||'{}'),prefs=JSON.parse(localStorage.getItem(PREF)||'{"settlementDay":15,"defaultMoney":10,"quick":[5,10,20]}'),month=new Date(),selectedDate='',selectedId='',installEvent=null;month=new Date(month.getFullYear(),month.getMonth(),1);prefs.settlementDay=Math.min(28,Math.max(1,Number(prefs.settlementDay)||15));const $=id=>document.getElementById(id),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(Number(n)||0),save=()=>localStorage.setItem(KEY,JSON.stringify(records)),savePrefs=()=>localStorage.setItem(PREF,JSON.stringify(prefs));
function migrate(){if(Object.keys(records).length)return;const old=JSON.parse(localStorage.getItem(OLD)||'{}');for(const[k,v]of Object.entries(old))records[k]=[{id:crypto.randomUUID?.()||String(Date.now()+Math.random()),amount:Number(v.amount)||0,note:v.note||'',type:v.type||'daily',status:v.status||'paid'}];if(Object.keys(old).length)save()}migrate();function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function items(k){return Array.isArray(records[k])?records[k]:[]}function allEntries(){return Object.entries(records).flatMap(([date,list])=>items(date).map(v=>({date,...v})))}function monthEntries(){const p=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-`;return allEntries().filter(v=>v.date.startsWith(p)).sort((a,b)=>b.date.localeCompare(a.date))}function cycleBounds(ref=new Date()){let s=ref.getDate()>=prefs.settlementDay?new Date(ref.getFullYear(),ref.getMonth(),prefs.settlementDay):new Date(ref.getFullYear(),ref.getMonth()-1,prefs.settlementDay);return{start:s,end:new Date(s.getFullYear(),s.getMonth()+1,prefs.settlementDay-1)}}function cycleEntries(){const{start,end}=cycleBounds(),a=dateKey(start),b=dateKey(end);return allEntries().filter(v=>v.date>=a&&v.date<=b)}function cycleText(){const{start,end}=cycleBounds();return`本期结算 ${start.getMonth()+1}月${start.getDate()}日—${end.getMonth()+1}月${end.getDate()}日`}
function render(){const y=month.getFullYear(),mo=month.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),today=dateKey(new Date()),g=$('grid');$('title').textContent=`${y}年${String(mo+1).padStart(2,'0')}月`;g.innerHTML='<span class="blank"></span>'.repeat(first);for(let d=1;d<=days;d++){const k=dateKey(new Date(y,mo,d)),list=items(k),paid=list.filter(v=>v.status==='paid'),pending=list.filter(v=>v.status==='pending'),sum=list.reduce((s,v)=>s+Number(v.amount),0),classes=list.length?(pending.length?'pending':'paid'):'empty';const extra=list.some(v=>v.type==='extra')?' extra':'';g.innerHTML+=`<button class="day ${classes}${extra} ${k===today?'today':''}" data-date="${k}"><i>${d}</i>${list.length?`<em>¥${sum.toFixed(0)}${list.length>1?'·'+list.length:''}</em>`:''}</button>`}const per=cycleEntries(),paid=per.filter(v=>v.status==='paid'),pending=per.filter(v=>v.status==='pending'),paidSum=paid.reduce((s,v)=>s+Number(v.amount),0),pendingSum=pending.reduce((s,v)=>s+Number(v.amount),0),max=per.length?Math.max(...per.map(v=>Number(v.amount))):0;$('sum').textContent=money(paidSum);$('cycleLabel').textContent=cycleText();$('pendingTotal').textContent=money(pendingSum);$('average').textContent=money(per.length?(paidSum+pendingSum)/per.length:0);$('highest').textContent=money(max);const list=monthEntries();$('list').innerHTML=list.length?list.map(v=>`<button class="entry" data-date="${v.date}" data-id="${v.id}"><i class="datebox">${Number(v.date.slice(-2))}日</i><span class="meta"><b>${v.date}</b><span>${v.type==='extra'?'额外报酬 · ':''}${v.note||'铲屎报酬'}</span></span>${v.type==='extra'?'<i class="badge extra">额外</i>':''}<i class="badge ${v.status==='pending'?'pending':''}">${v.status==='pending'?'待付款':'已付款'}</i><b class="amount">${money(v.amount)}</b></button>`).join(''):'<p class="empty">这个月还没有记录<br>点右下角“＋”开始记账吧</p>'}
function lastAmount(){return allEntries().sort((a,b)=>b.date.localeCompare(a.date))[0]?.amount||prefs.defaultMoney}function openRecord(date,id=''){selectedDate=date;selectedId=id;const draft=JSON.parse(localStorage.getItem(DRAFT)||'null'),existing=items(date).find(v=>v.id===id),v=draft?.date===date&&draft?.id===id?draft:existing;$('dateTitle').textContent=id?`${date} · 编辑记录`:date;$('recordType').value=v?.type||'daily';$('money').value=v?.amount??prefs.defaultMoney;$('note').value=v?.note||'';$('paid').value=v?.status||'paid';$('remove').style.visibility=id?'visible':'hidden';$('saveStatus').textContent=draft?.date===date&&draft?.id===id?'已恢复未提交草稿':'可在同一天添加多笔日常或额外报酬';document.querySelectorAll('[data-money]').forEach((b,i)=>b.textContent=`¥${prefs.quick[i]}`);$('recordShade').hidden=false;setTimeout(()=>$('money').focus(),80)}function closeRecord(){$('recordShade').hidden=true;selectedDate='';selectedId='';render()}function saveDraft(){if(!selectedDate||$('recordShade').hidden)return;localStorage.setItem(DRAFT,JSON.stringify({date:selectedDate,id:selectedId,amount:$('money').value,note:$('note').value,type:$('recordType').value,status:$('paid').value}));$('saveStatus').textContent='草稿已自动保存到本机'}
$('grid').onclick=e=>{const b=e.target.closest('[data-date]');if(b)openRecord(b.dataset.date)};$('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openRecord(b.dataset.date,b.dataset.id)};$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);render()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);render()};$('add').onclick=()=>openRecord(dateKey(new Date()));$('recordShade').onclick=e=>{if(e.target===$('recordShade'))closeRecord()};document.querySelector('.quick').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('money').value=b.id==='lastMoney'?lastAmount():b.dataset.money;$('saveStatus').textContent='草稿将在 1 分钟内自动保存'};$('recordForm').onsubmit=e=>{e.preventDefault();const amount=Number($('money').value);if(!Number.isFinite(amount)||amount<0)return;const row={id:selectedId||crypto.randomUUID?.()||String(Date.now()+Math.random()),amount,note:$('note').value.trim(),type:$('recordType').value,status:$('paid').value};const list=items(selectedDate);records[selectedDate]=selectedId?list.map(v=>v.id===selectedId?row:v):[...list,row];save();localStorage.removeItem(DRAFT);toast(selectedId?'记录已更新':'已添加一笔报酬');closeRecord()};$('remove').onclick=()=>{if(selectedId&&confirm('确定删除这笔记录吗？')){records[selectedDate]=items(selectedDate).filter(v=>v.id!==selectedId);if(!records[selectedDate].length)delete records[selectedDate];save();localStorage.removeItem(DRAFT);toast('已删除记录');closeRecord()}};$('clear').onclick=()=>{if(confirm('确定清空本月全部记录吗？')){const p=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-`;Object.keys(records).filter(k=>k.startsWith(p)).forEach(k=>delete records[k]);save();render();toast('已清空本月记录')}};
$('settingsBtn').onclick=()=>{$('settlementDay').value=prefs.settlementDay;$('defaultMoney').value=prefs.defaultMoney;$('quickOne').value=prefs.quick[0];$('quickTwo').value=prefs.quick[1];$('quickThree').value=prefs.quick[2];$('settingsShade').hidden=false};$('closeSettings').onclick=()=>$('settingsShade').hidden=true;$('settingsShade').onclick=e=>{if(e.target===$('settingsShade'))$('settingsShade').hidden=true};$('saveSettings').onclick=()=>{prefs={settlementDay:Math.min(28,Math.max(1,Number($('settlementDay').value)||15)),defaultMoney:Number($('defaultMoney').value)||0,quick:[Number($('quickOne').value)||0,Number($('quickTwo').value)||0,Number($('quickThree').value)||0]};savePrefs();$('settingsShade').hidden=true;render();toast('结算日与偏好已保存')};$('defaultBtn').onclick=()=>$('settingsBtn').click();$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'猫砂账本',version:3,exportedAt:new Date().toISOString(),records,prefs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`猫砂账本备份-${dateKey(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份文件已导出')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.records||typeof data.records!=='object')throw Error();if(!confirm('导入将覆盖当前本机账本，确定继续吗？'))return;records=data.records;prefs=data.prefs||prefs;save();savePrefs();render();toast('备份已恢复')}catch{alert('无法识别该备份文件')}finally{e.target.value=''}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});$('installBtn').onclick=async()=>{if(!installEvent){toast('请在浏览器菜单中选择“添加到主屏幕”');return}installEvent.prompt();await installEvent.userChoice;installEvent=null};setInterval(()=>{save();saveDraft()},60000);addEventListener('pagehide',()=>{save();saveDraft()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
